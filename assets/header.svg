<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Ikey — UI/UX and web designer. I design websites that turn visitors into customers."><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#F4F1EA" opacity=".07"/></pattern><radialGradient id="glow" cx="85%" cy="20%" r="55%"><stop offset="0" stop-color="#FF5A1F" stop-opacity=".28"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></radialGradient><clipPath id="frame"><rect width="1200" height="420" rx="22"/></clipPath><style>.sans{font-family:'Inter','Segoe UI',ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif}.serif{font-family:'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif}.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.rise{opacity:0;animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.75s}.d5{animation-delay:1s}@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}.pulse{animation:pulse 1.8s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3)}}.ticker{animation:tick 28s linear infinite}@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-1300px)}}.underline{stroke-dasharray:330;stroke-dashoffset:330;animation:draw 1.1s 1.2s cubic-bezier(.6,0,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style></defs><g clip-path="url(#frame)"><rect width="1200" height="420" fill="#0D0D0F"/><rect width="1200" height="420" fill="url(#dots)"/><rect width="1200" height="420" fill="url(#glow)"/><g class="rise d1"><text x="56" y="70" class="serif" font-size="34" fill="#F4F1EA" font-style="italic">ikɛƴ</