<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-label="Process: Discover, Design, Launch"><style>.sans{font-family:'Inter','Segoe UI',ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif}.serif{font-family:'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif}.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><rect width="1200" height="236" rx="22" fill="#0D0D0F"/><g transform="translate(40 26)"><g><text x="0" y="60" class="serif" font-size="64" fill="#FF5A1F">01</text><line x1="80" y1="40" x2="360" y2="40" stroke="#2A2A2E" stroke-dasharray="4 6"/><text x="0" y="104" class="sans" font-size="22" font-weight="600" fill="#F4F1EA">Discover</text><text x="0" y="134" class="sans" font-size="15" fill="#8B8A86"><tspan x="0" dy="0">Free call: goals, audience, timeline.</tspan><tspan x="0" dy="21">I'll tell you honestly if I'm the right</tspan><tspan x="0" dy="21">fit.</tspan></text></g><g><text x="380" y="60" class="serif" font-size="64" fill="#FF5A1F">02</text><line x1="460" y1="40" x2="740" y2="40" stroke="#2A2A2E" stroke-dasharray="4 6"/><text x="380" y="104" class="sans" font-size="22" font-weight="600" fill="#F4F1EA">Design</text><text x="380" y="134" class="sans" font-size="15" fill="#8B8A86"><tspan x="380" dy="0">Structure first, then visuals. You get</tspan><tspan x="380" dy="21">an update every two days — never radio</tspan><tspan x="380" dy="21">silence.</tspan></text></g><g><text x="760" y="60" class="serif" font-size="64" fill="#FF5A1F">03</text><line x1="840" y1="40" x2="1120" y2="40" stroke="#2A2A2E" stroke-dasharray="4 6"/><text x="760" y="104" class="sans" font-size="22" font-weight="600" fill="#F4F1EA">Launch</text><text x="760" y="134" class="sans" font-size="15" fill="#8B8A86"><tspan x="760" dy="0">Handoff + Framer build, tested on real</tspan><tspan x="760" dy="21">phones. You can edit it yourself</tspan><tspan x="760" dy="21">afterwards.</tspan></text></g></g></svg>